# Docker Compose
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cobalt-pilot-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=cobalt
      - KEYCLOAK_CLIENT_ID=cobalt-pilot
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/cobalt
      - OIDC_AUDIENCE=cobalt-pilot
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - DEBUG=true
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
    volumes:
      - backend_data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cobalt-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cobalt-pilot-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cobalt-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: cobalt-pilot-keycloak
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cobalt-network

volumes:
  backend_data:
  keycloak_data:

networks:
  cobalt-network:
    driver: bridge