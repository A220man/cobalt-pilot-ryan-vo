[project]
name = "cobalt-pilot-ryan-vo"
version = "1.0.0"
description = "Plugin Discovery for Claude Cowork - AI/ML developer tools"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["ai", "ml", "claude", "cowork", "plugins", "knowledge-work"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.34",
    "alembic==1.13.2",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "markdown==3.6",
    "python-slugify==8.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-httpx==0.28.0",
    "fakeredis==2.21.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.black]
line-length = 100
target-version = ["py312"]